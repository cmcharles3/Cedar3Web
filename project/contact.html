<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Cedar3 Technology</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">
      <h1>Cedar3 <span>Technology</span></h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Get in Touch</h2>
      <p>Visit us at <strong>25 Birmingham Road, Benoni South, Johannesburg</strong> or fill out the form below to log a support request or equipment repair query.</p>
      
      <form id="contact-form">
        <div>
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required placeholder="Enter your name">
        </div>
        <div>
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required placeholder="your.email@example.com">
        </div>
        <div>
          <label for="device">Equipment Type / Brand:</label>
          <input type="text" id="device" name="device" required placeholder="e.g. HP LaserJet / Desktop PC">
        </div>
        <div>
          <label for="message">Issue Description:</label>
          <textarea id="message" name="message" rows="4" required placeholder="Describe the problem..."></textarea>
        </div>
        <button type="submit">Submit Support Request</button>
      </form>
      <div id="form-feedback" style="margin-top: 1rem; font-weight: 600;"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cedar3 Technology (Pty) Ltd. All rights reserved. | <a href="references.html">References</a></p>
  </footer>
</body>
</html>
